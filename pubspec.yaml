name: repo_sphere
description: "A unified developer workspace for all your Git repositories."
publish_to: 'none'

version: 0.3.0+3

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.0.0
  http: ^1.2.2
  flutter_secure_storage: ^9.2.2
  url_launcher: ^6.3.0
  timeago: ^3.7.0
  flutter_highlight: ^0.7.0
  flutter_markdown_plus: ^1.0.7
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0
  google_fonts: ^6.2.1
  shared_preferences: ^2.3.2
  supabase_flutter: ^2.12.4
  sentry_flutter: ^9.0.0
  workmanager: ^0.10.10
  flutter_local_notifications: ^22.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  generate: true
  uses-material-design: true
