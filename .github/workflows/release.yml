name: Release

# Builds every platform and attaches the artifacts to a GitHub release.
# Trigger either way:
#  - push a tag like v0.3.0, or
#  - Actions -> Release -> Run workflow, enter the tag (e.g. v0.3.0). The tag is
#    created on the selected branch's latest commit. Leave it empty to only
#    build the artifacts without publishing.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create, e.g. v0.3.0 (empty = build only)'
        required: false
        default: ''

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.41.6'

jobs:
  # Never publish something that does not pass the same checks as CI.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with: { flutter-version: '${{ env.FLUTTER_VERSION }}', channel: stable, cache: true }
      - run: flutter pub get
      - run: dart analyze lib/ --fatal-infos
      - run: flutter test

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with: { flutter-version: '${{ env.FLUTTER_VERSION }}', channel: stable, cache: true }
      - run: flutter pub get
      - run: flutter build web --release
      - run: cd build/web && zip -r ../../RepoSphere-web.zip .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: web, path: RepoSphere-web.zip }

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with: { flutter-version: '${{ env.FLUTTER_VERSION }}', channel: stable, cache: true }
      - run: flutter pub get
      - run: flutter build macos --release
      - run: ditto -c -k --keepParent build/macos/Build/Products/Release/RepoSphere.app RepoSphere-macos.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: macos, path: RepoSphere-macos.zip }

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with: { flutter-version: '${{ env.FLUTTER_VERSION }}', channel: stable, cache: true }
      - run: flutter pub get
      - run: flutter build windows --release
      - run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath RepoSphere-windows-x64.zip
        shell: pwsh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: windows, path: RepoSphere-windows-x64.zip }

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev libjsoncpp-dev libcurl4-openssl-dev
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with: { flutter-version: '${{ env.FLUTTER_VERSION }}', channel: stable, cache: true }
      - run: flutter pub get
      - run: flutter build linux --release
      - run: tar -C build/linux/x64/release/bundle -czf RepoSphere-linux-x64.tar.gz .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: linux, path: RepoSphere-linux-x64.tar.gz }

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with: { flutter-version: '${{ env.FLUTTER_VERSION }}', channel: stable, cache: true }
      - run: flutter pub get
      # With the ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD /
      # ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD secrets set, the APK is signed
      # with your release key. Without them it falls back to the debug key
      # (installable by sideloading, not suitable for the Play Store).
      # A release (tag) build without the secrets fails at "Require a signed
      # APK when publishing" below instead of shipping a debug-signed APK.
      - name: Prepare release signing
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android/app/release.keystore
            {
              echo "storeFile=release.keystore"
              echo "storePassword=$STORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASSWORD"
            } > android/key.properties
          else
            echo "No release keystore configured; using the debug key."
            echo "unsigned=true" >> "$GITHUB_OUTPUT"
          fi
      - run: flutter build apk --release
      - run: cp build/app/outputs/flutter-apk/app-release.apk RepoSphere-android.apk
      # A debug-signed APK must never be attached to a public release: users
      # could not upgrade from it to the properly signed one.
      - name: Require a signed APK when publishing
        if: steps.signing.outputs.unsigned == 'true' && (startsWith(github.ref, 'refs/tags/v') || inputs.tag != '')
        run: |
          echo "::error::Publishing needs the ANDROID_KEYSTORE_* secrets (see doc/follow-ups.md). Re-run without a tag to only build."
          exit 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: android, path: RepoSphere-android.apk }

  publish:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
    needs: [verify, web, macos, windows, linux, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { path: dist, merge-multiple: true }
      - name: Validate tag
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::Tag '$TAG' must look like v1.2.3 or v1.2.3-rc.1"
            exit 1
          fi
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt
      - name: Release notes from CHANGELOG
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          v="${TAG#v}"
          awk -v v="$v" 'index($0, "## [" v "]") == 1 {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "See CHANGELOG.md." > notes.md; fi
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          flags=""
          case "$TAG" in v0.*|*-*) flags="--prerelease" ;; esac
          # --target creates the tag on this commit when it doesn't exist yet.
          gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "RepoSphere $TAG" --notes-file notes.md $flags
